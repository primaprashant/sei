name: Draft Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      release: true
    permissions:
      contents: read

  draft-upload:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          merge-multiple: true
          path: dist
          digest-mismatch: error
      - name: Validate identical bundle and create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          SEI_RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          SEI_RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
        run: bash scripts/release.sh draft
