name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: go1.27.1
  GOENV: 'off'
  GOWORK: 'off'
  GOFLAGS: -mod=readonly
  GOSUMDB: sum.golang.org

jobs:
  archives:
    name: Produce exact snapshot archives
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.snapshot.outputs.commit }}
      version: ${{ steps.snapshot.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified producer tools
        run: |
          uname -a
          test "$(uname -s)/$(uname -m)" = Linux/x86_64
          tools=$(mktemp -d "$RUNNER_TEMP/sei-release-tools.XXXXXX")
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            -o "$tools/go.tar.gz" https://go.dev/dl/go1.27.1.linux-amd64.tar.gz
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            -o "$tools/goreleaser.tar.gz" https://github.com/goreleaser/goreleaser/releases/download/v2.18.0/goreleaser_Linux_x86_64.tar.gz
          printf '%s  %s\n' \
            63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445 "$tools/go.tar.gz" \
            41cdf49b653784b03a08013dd99e382cd5d463049e915c2d818eaed182ae6197 "$tools/goreleaser.tar.gz" | shasum -a 256 --check -
          tar -xzf "$tools/go.tar.gz" -C "$tools"
          tar -xzf "$tools/goreleaser.tar.gz" -C "$tools" goreleaser
          printf '%s\n' "$tools/go/bin" "$tools" >> "$GITHUB_PATH"
          printf 'GOROOT=%s\n' "$tools/go" >> "$GITHUB_ENV"
      - name: Build once and verify archive contract
        id: snapshot
        run: |
          test "$(go env GOVERSION)" = go1.27.1
          goreleaser --version
          goreleaser --version | grep -Eq '^GitVersion: +2\.18\.0$'
          go mod download
          go mod verify
          goreleaser check
          GOPROXY=off goreleaser release --snapshot --clean
          SEI_RELEASE_COMMIT=$(git rev-parse HEAD)
          SEI_RELEASE_VERSION=$(jq -er .version dist/metadata.json)
          export SEI_RELEASE_COMMIT SEI_RELEASE_VERSION
          test "$(jq -er .commit dist/metadata.json)" = "$SEI_RELEASE_COMMIT"
          SEI_RELEASE_DIST=dist go test -count=1 -run '^TestRelease' -v .
          printf 'commit=%s\nversion=%s\n' "$SEI_RELEASE_COMMIT" "$SEI_RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Transfer only the four archives and checksum manifest
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sei-archives-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/*.tar.gz
            dist/*_checksums.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Reject tracked-file changes
        if: always()
        run: git diff --exit-code HEAD -- .

  checks:
    needs: archives
    name: Native checks (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
            host: Linux/x86_64
            go-sha256: 63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445
            lint-sha256: 2277d43b98ec0054280f2ac26b53268bae97682444678a59a657dd565da021d6
            shellcheck-platform: linux.x86_64
            shellcheck-sha256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            host: Linux/aarch64
            go-sha256: 3450b45a3f9ee8568792736a5c5e70a1f2e9b36c35a8f74958c03e51d7d92bec
            lint-sha256: a2a4e0065aa41be71f7c5ac90f271b61751331e5d04314e62afe4027855f0893
            shellcheck-platform: linux.aarch64
            shellcheck-sha256: 68a8133197a50beb8803f8d42f9908d1af1c5540d4bb05fdfca8c1fa47decefc
          - runner: macos-15-intel
            os: darwin
            arch: amd64
            host: Darwin/x86_64
            go-sha256: 8f8f52c6649542cf027bbc9b9c68d1ec042f9f34808a40413f0b8b3f66f3caa4
            lint-sha256: 8a13aaf9cbbb1dee52824e862cf0d0720e5bb97c1f4260d1e51623a09492b57b
            shellcheck-platform: darwin.x86_64
            shellcheck-sha256: c2c15e08df0e8fbc374c335b230a7ee958c313fa5714817a59aa59f1aa594f51
          - runner: macos-15
            os: darwin
            arch: arm64
            host: Darwin/arm64
            go-sha256: ee215d57e0ec269c60cc9ceca68e6bda321ba9ee5afe24f4b0988703c2d87d12
            lint-sha256: f4bf83f0b64f055c42b28fc9a38861839f69c096e61c788e72dfaae412011789
            shellcheck-platform: darwin.aarch64
            shellcheck-sha256: 339b930feb1ea764467013cc1f72d09cd6b869ebf1013296ba9055ab2ffbd26f
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record and assert native runner
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          printf 'Runner OS=%s arch=%s image=%s version=%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -a
          test "$(uname -s)/$(uname -m)" = "$EXPECTED_HOST"
          if [ "$RUNNER_OS" = macOS ]; then
            sw_vers
            test "$(sysctl -in sysctl.proc_translated 2>/dev/null || true)" != 1
          else
            cat /etc/os-release
          fi
          cc --version

      - name: Install verified Go and golangci-lint archives
        env:
          TOOL_OS: ${{ matrix.os }}
          TOOL_ARCH: ${{ matrix.arch }}
          GO_SHA256: ${{ matrix.go-sha256 }}
          LINT_SHA256: ${{ matrix.lint-sha256 }}
        run: |
          tools=$(mktemp -d "$RUNNER_TEMP/sei-tools.XXXXXX")
          go_archive="go1.27.1.$TOOL_OS-$TOOL_ARCH.tar.gz"
          lint_package="golangci-lint-2.13.2-$TOOL_OS-$TOOL_ARCH"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$tools/$go_archive" "https://go.dev/dl/$go_archive"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$tools/$lint_package.tar.gz" \
            "https://github.com/golangci/golangci-lint/releases/download/v2.13.2/$lint_package.tar.gz"
          # Both platforms provide shasum; fail before extracting either archive.
          printf '%s  %s\n' "$GO_SHA256" "$tools/$go_archive" \
            "$LINT_SHA256" "$tools/$lint_package.tar.gz" | shasum -a 256 --check -
          tar -xzf "$tools/$go_archive" -C "$tools"
          mkdir -p .bin "$RUNNER_TEMP/sei-home" "$RUNNER_TEMP/sei-config"
          tar -xzf "$tools/$lint_package.tar.gz" -C .bin \
            --strip-components=1 "$lint_package/golangci-lint"
          printf '%s\n' "$tools/go/bin" >> "$GITHUB_PATH"
          printf 'GOROOT=%s\n' "$tools/go" >> "$GITHUB_ENV"

      - name: Install verified native ShellCheck and lint installer
        env:
          TOOL_PLATFORM: ${{ matrix.shellcheck-platform }}
          TOOL_SHA256: ${{ matrix.shellcheck-sha256 }}
        run: |
          tools=$(mktemp -d "$RUNNER_TEMP/sei-shellcheck.XXXXXX")
          archive="shellcheck-v0.11.0.$TOOL_PLATFORM.tar.gz"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$tools/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/$archive"
          printf '%s  %s\n' "$TOOL_SHA256" "$tools/$archive" | shasum -a 256 --check -
          tar -xzf "$tools/$archive" -C .bin --strip-components=1 shellcheck-v0.11.0/shellcheck
          ./.bin/shellcheck --version
          test "$(./.bin/shellcheck --version | grep '^version:')" = 'version: 0.11.0'
          sh -n scripts/install.sh
          ./.bin/shellcheck -s sh scripts/install.sh

      - name: Standard checks
        env:
          HOME: ${{ runner.temp }}/sei-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/sei-config
          EXPECTED_PLATFORM: ${{ matrix.os }}/${{ matrix.arch }}
        run: |
          go version
          test "$(go env GOVERSION)" = go1.27.1
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "$EXPECTED_PLATFORM"
          test "$(go env GOOS)/$(go env GOARCH)" = "$EXPECTED_PLATFORM"
          go env GOTOOLCHAIN GOROOT GOOS GOARCH CGO_ENABLED
          ./.bin/golangci-lint version
          go mod download
          go mod verify
          go mod tidy -diff
          ./.bin/golangci-lint config verify --config .golangci.yml
          ./.bin/golangci-lint fmt --config .golangci.yml --diff
          ./.bin/golangci-lint run --config .golangci.yml --timeout=5m ./...
          go vet ./...
          go test -count=1 ./...
          mkdir -p bin
          go build -o ./bin/sei .
          ./bin/sei --help
          ./bin/sei --version

      - name: Linux amd64 race checks
        if: matrix.runner == 'ubuntu-24.04'
        env:
          HOME: ${{ runner.temp }}/sei-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/sei-config
          CGO_ENABLED: '1'
        run: go test -race -count=1 ./...

      - name: Download identical producer archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.archives.outputs.artifact-id }}
          merge-multiple: true
          path: dist
          digest-mismatch: error

      - name: Execute exact native archive including PTY restoration
        env:
          SEI_RELEASE_DIST: dist
          SEI_RELEASE_VERSION: ${{ needs.archives.outputs.version }}
          SEI_RELEASE_COMMIT: ${{ needs.archives.outputs.commit }}
          HOME: ${{ runner.temp }}/sei-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/sei-config
        run: |
          test "$(git rev-parse HEAD)" = "$SEI_RELEASE_COMMIT"
          go test -count=1 -run '^TestRelease' -v .

      - name: Linux amd64 coverage report
        if: matrix.runner == 'ubuntu-24.04'
        env:
          HOME: ${{ runner.temp }}/sei-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/sei-config
        run: |
          go test -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee "$RUNNER_TEMP/coverage-functions.txt"
          {
            printf '### Go Statement Coverage\n\n```text\n'
            cat "$RUNNER_TEMP/coverage-functions.txt"
            printf '```\n\nNo global percentage gate; reviewed gaps: docs/test-matrix.md.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reject tracked-file changes
        if: always()
        run: git diff --exit-code HEAD -- .

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzParseConfig, FuzzPathName]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified Go archive
        run: |
          printf 'Runner OS=%s arch=%s image=%s version=%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -a
          test "$(uname -s)/$(uname -m)" = Linux/x86_64
          tools=$(mktemp -d "$RUNNER_TEMP/sei-fuzz-tools.XXXXXX")
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$tools/go.tar.gz" https://go.dev/dl/go1.27.1.linux-amd64.tar.gz
          printf '%s  %s\n' 63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445 \
            "$tools/go.tar.gz" | shasum -a 256 --check -
          tar -xzf "$tools/go.tar.gz" -C "$tools"
          mkdir -p "$RUNNER_TEMP/sei-home" "$RUNNER_TEMP/sei-config"
          printf '%s\n' "$tools/go/bin" >> "$GITHUB_PATH"
          printf 'GOROOT=%s\n' "$tools/go" >> "$GITHUB_ENV"

      - name: Fuzz one target in the root package
        env:
          HOME: ${{ runner.temp }}/sei-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/sei-config
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          go version
          test "$(go env GOVERSION)" = go1.27.1
          test "$(go env GOOS)/$(go env GOARCH)" = linux/amd64
          go mod download
          go mod verify
          go test . -run='^$' -fuzz="^${FUZZ_TARGET}$" -fuzztime=30s -parallel=2 -timeout=2m

      - name: Print regression inputs on failure
        if: failure()
        run: |
          if [ -d testdata/fuzz ]; then
            find testdata/fuzz -type f -print -exec cat {} \;
          fi

      - name: Reject tracked-file changes
        if: always()
        run: git diff --exit-code HEAD -- .
