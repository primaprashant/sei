{
  "version": 2,
  "project_name": "sei",
  "env": ["GOTOOLCHAIN=go1.27.1", "GOFLAGS=-mod=readonly"],
  "builds": [{
    "id": "sei",
    "main": ".",
    "binary": "sei",
    "env": ["CGO_ENABLED=0"],
    "goos": ["linux", "darwin"],
    "goarch": ["amd64", "arm64"],
    "goamd64": ["v1"],
    "goarm64": ["v8.0"],
    "flags": ["-trimpath"],
    "ldflags": ["-s -w -X main.version={{ .Version }}"],
    "mod_timestamp": "{{ .CommitTimestamp }}"
  }],
  "archives": [{
    "formats": ["tar.gz"],
    "name_template": "sei_{{ .Version }}_{{ .Os }}_{{ .Arch }}",
    "files": ["README.md", "LICENSE", "THIRD_PARTY_NOTICES"]
  }],
  "checksum": {
    "name_template": "sei_{{ .Version }}_checksums.txt",
    "algorithm": "sha256"
  },
  "snapshot": {"version_template": "{{ .Version }}-snapshot.{{ .ShortCommit }}"},
  "changelog": {"disable": true},
  "release": {"disable": true}
}
